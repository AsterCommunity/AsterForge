# cargo-audit 配置
# 忽略已确认不影响本项目的上游传递依赖 advisory

[advisories]
ignore = [
    # rsa 0.9.10 Marvin Attack（计时侧信道，medium 5.9）
    # 仅通过 openidconnect 4.x 引入，且只用于 OIDC JWKS 公钥验签；
    # Marvin Attack 需要攻击者可探测的 RSA 私钥解密/签名预言机，
    # 本项目任何代码路径都不持有 RSA 私钥，不存在解密预言机，不可利用。
    # 上游无修复版本（No fixed upgrade is available），待 openidconnect 迁移后移除
    "RUSTSEC-2023-0071",

    # paste 1.0.15 unmaintained
    # 仅通过 tikv-jemalloc-ctl 的 proc-macro 编译期路径引入（Linux allocator）
    # 非已知漏洞，不进入服务运行时攻击面
    "RUSTSEC-2024-0436",

    # rkyv 0.7.46 archive validation issue
    # 仅作为 rust_decimal 的 optional dependency 出现在 Cargo.lock；AsterForge、SeaORM、
    # SQLx 和所有 workspace feature 均未启用 rust_decimal/rkyv 集成。
    # `cargo tree --workspace --all-features --target all -i rkyv@0.7.46` 无运行或构建路径。
    # 上游 rust_decimal 仍声明 rkyv 0.7；待其迁移到 rkyv >= 0.8.17 后删除本项。
    "RUSTSEC-2026-0235",

    # h2 0.3.27 unbounded empty DATA frames (RUSTSEC-2026-0258)
    # actix-http 3.13.3（当前 crates.io 最新版）仍锁定 h2 ^0.3；AsterDrive
    # 没有可直接替换的 h2 版本，因为 h2 0.4 不满足该依赖的 semver 约束。
    # 保留审计阻塞并不能修复上游协议栈；待 actix-http 发布切换到 h2 >= 0.4.16
    # 的版本后立即删除本项并刷新 Cargo.lock。当前 PR 不扩大为替换 Actix HTTP 栈。
    "RUSTSEC-2026-0258",
]
