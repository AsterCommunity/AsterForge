[package]
name = "aster_forge_auth"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Product-neutral local session authentication mechanics"
readme = "README.md"
publish = true

[features]
default = ["aws-lc-rs"]
aws-lc-rs = ["jsonwebtoken/aws_lc_rs"]
rust-crypto = ["jsonwebtoken/rust_crypto"]
password = ["dep:aster_forge_crypto"]

[dependencies]
aster_forge_crypto = { workspace = true, features = ["password"], optional = true }
async-trait.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tokio-util.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
