[package]
name = "aster_forge_external_auth"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Feature-gated external authentication provider drivers for Aster services"
readme = "README.md"
publish = true

[features]
default = ["oidc", "oauth2", "rustls-aws-lc-rs"]
openapi = ["dep:utoipa"]
sea-orm = ["dep:sea-orm"]
rustls-aws-lc-rs = ["aster_forge_http?/rustls-aws-lc-rs"]
rustls-ring = ["aster_forge_http?/rustls-ring"]
native-tls = ["aster_forge_http?/native-tls"]
oidc = ["dep:aster_forge_http", "dep:openidconnect", "dep:reqwest"]
oauth2 = ["dep:aster_forge_http", "dep:base64", "dep:rand", "dep:reqwest", "dep:sha2"]
github = ["oauth2"]
google = ["oidc"]
microsoft = ["oidc"]
qq = ["oauth2"]

[dependencies]
aster_forge_crypto = { workspace = true, features = ["sha256"] }
aster_forge_http = { workspace = true, features = ["json"], optional = true }
aster_forge_utils = { workspace = true }
aster_forge_validation = { workspace = true }
async-trait.workspace = true
base64 = { workspace = true, optional = true }
openidconnect = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, features = ["json"], optional = true }
sea-orm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
thiserror.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }
url.workspace = true

[dev-dependencies]
actix-web.workspace = true
aster_forge_test = { workspace = true, features = ["logs"] }
tokio.workspace = true

[lints]
workspace = true
