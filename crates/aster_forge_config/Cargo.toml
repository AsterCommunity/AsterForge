[package]
name = "aster_forge_config"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared runtime configuration primitives for Aster services"
readme = "README.md"
publish = true

[features]
default = []
openapi = ["dep:utoipa"]
redis-pubsub = ["dep:redis", "aster_forge_events/redis"]
sea-orm = ["dep:sea-orm"]

[dependencies]
async-trait.workspace = true
aster_forge_events = { path = "../aster_forge_events", version = "=0.1.0-alpha.1" }
aster_forge_utils = { path = "../aster_forge_utils", version = "=0.1.0-alpha.1" }
futures.workspace = true
redis = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
aster_forge_test = { path = "../aster_forge_test", version = "=0.1.0-alpha.1", features = ["redis"] }
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true

[[test]]
name = "redis_config_sync"
path = "tests/redis_config_sync.rs"
required-features = ["redis-pubsub"]

[lints]
workspace = true
