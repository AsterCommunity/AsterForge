[package]
name = "aster_forge_config"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared runtime configuration primitives for Aster services"
readme = "README.md"
keywords = ["config", "configuration", "settings", "runtime"]
categories = ["config"]
publish = true

[features]
default = []
openapi = ["dep:utoipa"]
redis-pubsub-core = ["dep:redis", "aster_forge_events/redis-core"]
redis-pubsub = ["redis-pubsub-core", "redis/tokio-rustls-comp", "aster_forge_events/redis"]
redis-pubsub-native-tls = ["redis-pubsub-core", "redis/tokio-native-tls-comp", "aster_forge_events/redis-native-tls"]
sea-orm-core = ["dep:sea-orm"]
sea-orm = ["sea-orm-core", "sea-orm/runtime-tokio-rustls"]
sea-orm-native-tls = ["sea-orm-core", "sea-orm/runtime-tokio-native-tls"]

[dependencies]
async-trait.workspace = true
aster_forge_config_macros.workspace = true
aster_forge_events = { workspace = true }
aster_forge_utils = { workspace = true }
futures.workspace = true
redis = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["redis"] }
tokio = { workspace = true, features = ["test-util"] }
uuid.workspace = true

[[test]]
name = "redis_config_sync"
path = "tests/redis_config_sync.rs"
required-features = ["redis-pubsub"]

[lints]
workspace = true
