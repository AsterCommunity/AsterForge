[package]
name = "aster_forge_observability"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "HTTP observability endpoints for Aster services"
readme = "README.md"
publish = true

[features]
default = ["actix"]
actix = ["dep:actix-web"]
prometheus = ["aster_forge_metrics/backend-prometheus"]
axum = ["dep:axum"]

[dependencies]
actix-web = { workspace = true, optional = true }
axum = { workspace = true, optional = true }
aster_forge_metrics = { path = "../aster_forge_metrics", version = "=0.1.0-alpha.1" }
tracing.workspace = true

[lints]
workspace = true

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
tokio.workspace = true
