[package]
name = "aster_forge_test"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared integration-test infrastructure for Aster services"
readme = "README.md"
publish = true

[features]
default = []
containers = ["dep:fs2", "dep:serde", "dep:serde_json", "dep:testcontainers", "dep:tokio"]
process = []
smtp = ["dep:aster_forge_http", "containers", "dep:reqwest"]
redis = ["containers", "dep:redis"]
postgres = ["containers", "dep:sea-orm"]
mysql = ["containers", "dep:sea-orm"]
logs = ["dep:tracing-subscriber", "dep:tracing"]

[dependencies]
aster_forge_http = { path = "../aster_forge_http", version = "=0.1.0-alpha.1", optional = true }
aster_forge_utils = { path = "../aster_forge_utils", version = "=0.1.0-alpha.1" }
fs2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["fmt"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
url.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
