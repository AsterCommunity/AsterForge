[package]
name = "aster_forge_test"
version = "0.1.0-alpha.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared integration-test infrastructure for Aster services"
readme = "README.md"
keywords = ["testing", "integration-testing", "fixtures", "testcontainers"]
categories = ["development-tools"]
publish = true

[features]
default = []
containers = ["dep:fs2", "dep:serde", "dep:serde_json", "dep:testcontainers", "dep:tokio"]
process = []
smtp = ["dep:aster_forge_http", "aster_forge_http/json", "containers"]
redis-core = ["containers", "dep:redis"]
redis = ["redis-core", "redis/tokio-rustls-comp"]
redis-native-tls = ["redis-core", "redis/tokio-native-tls-comp"]
database-core = ["containers", "dep:sea-orm"]
postgres = ["database-core", "sea-orm/runtime-tokio-rustls"]
mysql = ["database-core", "sea-orm/runtime-tokio-rustls"]
postgres-native-tls = ["database-core", "sea-orm/runtime-tokio-native-tls"]
mysql-native-tls = ["database-core", "sea-orm/runtime-tokio-native-tls"]
logs = ["dep:tracing-subscriber", "dep:tracing"]

[dependencies]
aster_forge_http = { workspace = true, optional = true }
aster_forge_utils = { workspace = true }
fs2 = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
testcontainers = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
redis = { workspace = true, optional = true }
sea-orm = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, features = ["fmt"], optional = true }
tracing = { workspace = true, features = ["std"], optional = true }

[dev-dependencies]
url.workspace = true

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }
