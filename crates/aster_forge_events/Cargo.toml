[package]
name = "aster_forge_events"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Product-neutral transient event transport primitives"
readme = "README.md"
publish = true

[features]
default = []
redis = ["dep:redis", "redis/tokio-rustls-comp"]
redis-native-tls = ["dep:redis", "redis/tokio-native-tls-comp"]

[dependencies]
async-trait.workspace = true
aster_forge_utils = { workspace = true }
futures.workspace = true
redis = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["redis"] }
uuid.workspace = true

[[test]]
name = "redis_event_bus"
path = "tests/redis_event_bus.rs"
required-features = ["redis"]

[lints]
workspace = true
