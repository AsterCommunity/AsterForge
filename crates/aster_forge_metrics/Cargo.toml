[package]
name = "aster_forge_metrics"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared metrics recorder traits and subsystem registration primitives"
readme = "README.md"
publish = true

[features]
default = ["rustls-aws-lc-rs"]
allocator-metrics = ["dep:aster_forge_alloc"]
backend-prometheus = ["dep:prometheus", "dep:opentelemetry-prometheus"]
rustls-aws-lc-rs = ["aster_forge_http?/rustls-aws-lc-rs"]
rustls-ring = ["aster_forge_http?/rustls-ring"]
native-tls = ["aster_forge_http?/native-tls"]
otlp = ["dep:aster_forge_http", "dep:opentelemetry-proto", "dep:prost", "dep:reqwest", "reqwest/blocking"]
runtime-health = ["dep:aster_forge_runtime"]

[dependencies]
aster_forge_http = { path = "../aster_forge_http", version = "=0.1.0-alpha.2", features = ["blocking"], optional = true }
opentelemetry.workspace = true
opentelemetry_sdk.workspace = true
opentelemetry-prometheus = { workspace = true, optional = true }
opentelemetry-proto = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
parking_lot.workspace = true
hashbrown.workspace = true
aster_forge_alloc = { path = "../aster_forge_alloc", version = "=0.1.0-alpha.1", optional = true }
aster_forge_runtime = { path = "../aster_forge_runtime", version = "=0.1.0-alpha.1", optional = true }
prometheus = { workspace = true, optional = true }
sysinfo.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
tracing.workspace = true

[lints]
workspace = true

[[example]]
name = "recording_cost"
required-features = ["backend-prometheus"]
