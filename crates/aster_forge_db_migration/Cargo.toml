[package]
name = "aster_forge_db_migration"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared SeaORM migration coordination and schema helpers for Aster products"
readme = "README.md"
keywords = ["database", "migration", "sea-orm", "schema"]
categories = ["database"]
publish = true

[features]
default = ["rustls"]
rustls = ["sea-orm-migration/runtime-tokio-rustls"]
native-tls = ["sea-orm-migration/runtime-tokio-native-tls"]

[dependencies]
sea-orm-migration.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = ["time"] }

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["mysql", "postgres"] }
tokio = { workspace = true, features = ["sync"] }

[[test]]
name = "coordination_containers"
path = "tests/coordination_containers.rs"

[lints]
workspace = true
