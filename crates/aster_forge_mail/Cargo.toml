[package]
name = "aster_forge_mail"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared mail infrastructure helpers for Aster services"
readme = "README.md"
publish = true

[features]
default = []
openapi = ["dep:utoipa"]
persistence = ["dep:sea-orm"]
runtime-component = [
    "dep:aster_forge_runtime",
    "dep:aster_forge_tasks",
    "aster_forge_tasks/runtime-component",
]

[dependencies]
aster_forge_runtime = { workspace = true, optional = true }
aster_forge_tasks = { workspace = true, optional = true }
aster_forge_utils = { workspace = true }
aster_forge_validation = { workspace = true }
async-trait.workspace = true
lettre.workspace = true
sea-orm = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
utoipa = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["logs"] }
