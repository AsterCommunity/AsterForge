[package]
name = "aster_forge_http"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Product-neutral outbound HTTP client mechanics for Aster services"
readme = "README.md"
publish = true

[features]
default = []
blocking = ["reqwest/blocking"]
json = ["reqwest/json", "dep:serde"]
form = ["reqwest/form", "dep:serde"]
query = ["reqwest/query", "dep:serde"]
multipart = ["reqwest/multipart"]
stream = ["reqwest/stream"]
http2 = ["reqwest/http2"]
charset = ["reqwest/charset"]
system-proxy = ["reqwest/system-proxy"]
rustls = ["reqwest/rustls-no-provider"]
rustls-aws-lc-rs = ["rustls", "reqwest/rustls"]
rustls-ring = ["rustls", "dep:rustls", "rustls/ring"]
native-tls = ["reqwest/native-tls"]
native-tls-vendored = ["native-tls", "reqwest/native-tls-vendored"]

[dependencies]
http.workspace = true
reqwest.workspace = true
rustls = { version = "0.23", default-features = false, features = ["std"], optional = true }
thiserror.workspace = true
serde = { workspace = true, optional = true }

[dev-dependencies]
rcgen.workspace = true
tokio-rustls.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util", "net"] }

[lints]
workspace = true
