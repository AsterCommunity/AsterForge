[package]
name = "aster_forge_tasks"
version = "0.1.0-alpha.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared background task primitives for Aster services"
readme = "README.md"
publish = true

[features]
default = []
openapi = ["dep:utoipa"]
runtime = ["dep:aster_forge_runtime", "dep:uuid"]
runtime-component = ["runtime"]

[dependencies]
aster_forge_runtime = { workspace = true, optional = true }
aster_forge_utils = { workspace = true }
async-trait.workspace = true
chrono = { workspace = true, features = ["clock"] }
futures.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util.workspace = true
tracing = { workspace = true, features = ["std"] }
utoipa = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[lints]
workspace = true

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["logs"] }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber.workspace = true

[[example]]
name = "consumer_wakeup"
required-features = ["runtime"]
