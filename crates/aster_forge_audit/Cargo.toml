[package]
name = "aster_forge_audit"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared audit runtime integration for Aster services"
readme = "README.md"
publish = true

[features]
default = []
db-writer = ["dep:aster_forge_db", "dep:sea-orm"]
database-container-tests = ["db-writer"]
mail-outbox-dependency = ["dep:aster_forge_mail"]

[dependencies]
aster_forge_db = { workspace = true, features = ["audit-log"], optional = true }
aster_forge_mail = { workspace = true, optional = true }
aster_forge_runtime = { workspace = true }
sea-orm = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }
tracing.workspace = true

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["postgres"] }
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
