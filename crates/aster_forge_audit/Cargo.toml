[package]
name = "aster_forge_audit"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared audit runtime integration for Aster services"
readme = "README.md"
publish = true

[features]
default = []
db-writer-core = ["dep:aster_forge_db", "dep:sea-orm"]
db-writer = ["db-writer-core", "aster_forge_db/rustls", "sea-orm/runtime-tokio-rustls"]
db-writer-native-tls = ["db-writer-core", "sea-orm/runtime-tokio-native-tls", "aster_forge_db/native-tls"]
database-container-tests = ["db-writer"]
mail-outbox-dependency = ["dep:aster_forge_mail", "aster_forge_mail/rustls"]

[dependencies]
aster_forge_db = { workspace = true, default-features = false, features = ["audit-log"], optional = true }
aster_forge_mail = { workspace = true, optional = true }
aster_forge_runtime = { workspace = true }
sea-orm = { workspace = true, optional = true }
tokio = { workspace = true, features = ["sync", "time"] }

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["postgres"] }
uuid.workspace = true
chrono.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
