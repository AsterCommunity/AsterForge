[package]
name = "aster_forge_file_classification"
version = "0.1.0-alpha.3"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "File extension parsing and category classification helpers"
readme = "README.md"
keywords = ["files", "extensions", "classification", "parsing"]
categories = ["parsing", "filesystem"]
publish = true

[features]
default = []
openapi = ["dep:utoipa"]
sea-orm-core = ["dep:sea-orm"]
sea-orm = ["sea-orm-core", "sea-orm/runtime-tokio-rustls"]
sea-orm-native-tls = ["sea-orm-core", "sea-orm/runtime-tokio-native-tls"]

[dependencies]
sea-orm = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true
utoipa = { workspace = true, optional = true }

[lints]
workspace = true
