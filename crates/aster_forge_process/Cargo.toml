[package]
name = "aster_forge_process"
version = "0.1.0-alpha.4"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Bounded child-process lifecycle mechanics for Aster services"
readme = "README.md"
keywords = ["process", "subprocess", "child-process", "lifecycle"]
categories = ["os", "development-tools"]
publish = true

[dependencies]
process-wrap.workspace = true
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
libc.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true

[[test]]
name = "process"
path = "tests/process.rs"
harness = false
