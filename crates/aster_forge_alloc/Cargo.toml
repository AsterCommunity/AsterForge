[package]
name = "aster_forge_alloc"
version = "0.1.0-alpha.2"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared allocator tracking and memory statistics helpers"
readme = "README.md"
keywords = ["allocator", "memory", "stats", "tracking"]
categories = ["memory-management", "development-tools"]
publish = true

[features]
default = []
jemalloc = []
jemalloc-stats = ["jemalloc", "dep:tracing", "dep:tikv-jemalloc-ctl", "tikv-jemalloc-ctl/stats"]

[dependencies]
tikv-jemalloc-ctl = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
