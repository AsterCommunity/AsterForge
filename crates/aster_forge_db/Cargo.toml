[package]
name = "aster_forge_db"
version = "0.1.0-alpha.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Shared database utilities for Aster services"
readme = "README.md"
keywords = ["database", "sea-orm", "sql", "orm"]
categories = ["database"]
publish = true

[dependencies]
aster_forge_api = { workspace = true }
aster_forge_config = { workspace = true, features = ["sea-orm-core"], optional = true }
aster_forge_mail = { workspace = true, default-features = false, features = ["persistence"], optional = true }
aster_forge_metrics = { workspace = true }
aster_forge_runtime = { workspace = true, optional = true }
aster_forge_tasks = { workspace = true, optional = true }
aster_forge_utils = { workspace = true }
async-trait.workspace = true
chrono = { workspace = true, features = ["clock"] }
sea-orm.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true

[features]
default = ["rustls"]
rustls = ["sea-orm/runtime-tokio-rustls"]
native-tls = ["sea-orm/runtime-tokio-native-tls"]
all = [
    "audit-log",
    "mail-outbox",
    "runtime-component",
    "runtime-lease",
    "scheduled-task",
    "system-config",
]
audit-log = []
mail-outbox-core = ["dep:aster_forge_mail"]
mail-outbox = ["mail-outbox-core", "aster_forge_mail/rustls"]
mail-outbox-native-tls = ["mail-outbox-core", "aster_forge_mail/native-tls"]
runtime-component = ["dep:aster_forge_runtime"]
runtime-lease = ["dep:aster_forge_runtime"]
scheduled-task = ["dep:aster_forge_tasks", "aster_forge_tasks/runtime"]
system-config = ["dep:aster_forge_config"]
database-container-tests = []

[dev-dependencies]
aster_forge_test = { workspace = true, features = ["mysql", "postgres", "logs"] }
futures.workspace = true
serde_json.workspace = true
url.workspace = true
uuid.workspace = true

[[test]]
name = "credentialed_databases"
path = "tests/credentialed_databases.rs"
required-features = ["database-container-tests"]

[lints]
workspace = true
