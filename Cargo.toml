[workspace]
members = [
    "crates/aster_forge_actix_middleware",
    "crates/aster_forge_actix_observability",
    "crates/aster_forge_audit",
    "crates/aster_forge_api_docs_macros",
    "crates/aster_forge_api",
    "crates/aster_forge_alloc",
    "crates/aster_forge_cache",
    "crates/aster_forge_cloud_files/core",
    "crates/aster_forge_cloud_files/linux",
    "crates/aster_forge_cloud_files/macos_bridge",
    "crates/aster_forge_cloud_files/windows",
    "crates/aster_forge_config",
    "crates/aster_forge_crypto",
    "crates/aster_forge_db",
    "crates/aster_forge_db_migration",
    "crates/aster_forge_external_auth",
    "crates/aster_forge_events",
    "crates/aster_forge_file_classification",
    "crates/aster_forge_http",
    "crates/aster_forge_logging",
    "crates/aster_forge_metrics",
    "crates/aster_forge_panic",
    "crates/aster_forge_runtime",
    "crates/aster_forge_mail",
    "crates/aster_forge_storage_core",
    "crates/aster_forge_tasks",
    "crates/aster_forge_test",
    "crates/aster_forge_utils",
    "crates/aster_forge_validation",
    "crates/aster_forge_webdav",
    "crates/aster_forge_xml",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.94.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/AsterCommunity/AsterForge"
authors = [
    "AptS-1547 <apts-1547@esaps.net>",
    "AptS-1548 <apts-1548@esaps.net>",
    "AptS-1738 <apts-1738@esaps.net>",
    "AptS-1543 <apts-1543@esaps.net>",
]

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Suppressions must remain observable: `expect` reports when its justification goes stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
multiple_unsafe_ops_per_block = "deny"
undocumented_unsafe_blocks = "deny"

[workspace.dependencies]
actix-web = "4.14.1"
actix-governor = "0.10"
aes-gcm = "0.11"
async-trait = "0.1"
argon2 = "0.5.3"
base64 = { version = "0.23", default-features = false, features = ["std"] }
bloomfilter = "3.0.1"
bytes = "1"
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
criterion = { version = "0.8", features = ["async_tokio"] }
dashmap = "6"
fs2 = "0.4"
fuser = "0.18.0"
futures = "0.3"
governor = "0.10"
headers = "0.4.1"
hmac = "0.13"
hkdf = "0.13"
http = "1"
httpdate = "1"
ipnet = "2.12.1"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls"] }
md-5 = "0.11"
moka = { version = "0.12.15", features = ["future"] }
parking_lot = "0.12"
percent-encoding = "2.3"
proc-macro2 = "1"
quick-xml = { version = "0.41", default-features = false }
quote = "1"
openidconnect = { version = "4.0.1", default-features = false }
rand = { version = "0.10.2", default-features = false, features = ["std", "std_rng", "thread_rng"] }
rand_core_06 = { package = "rand_core", version = "0.6", features = ["getrandom"] }
redis = { version = "1.5.0", features = ["connection-manager", "tokio-comp", "tokio-rustls-comp"] }
reqwest = { version = "0.13", features = ["json"] }
sea-orm = { version = "2.0.1", features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "macros", "runtime-tokio-rustls"] }
sea-orm-migration = { version = "2.0.1", default-features = false, features = ["sqlx-mysql", "sqlx-postgres", "sqlx-sqlite", "runtime-tokio-rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
prometheus = { version = "0.14", default-features = false }
subtle = "2"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
testcontainers = { version = "0.28", features = ["reusable-containers"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tokio-util = "0.7"
tracing = { version = "0.1.44", default-features = false }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tikv-jemalloc-ctl = "0.7"
utoipa = { version = "5.5.0", features = ["chrono", "actix_extras", "repr"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
windows = { version = "0.62.2", default-features = false }
