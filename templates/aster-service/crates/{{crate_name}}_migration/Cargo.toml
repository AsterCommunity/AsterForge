[package]
name = "{{crate_name}}_migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
async-trait.workspace = true
aster_forge_db = { workspace = true, features = ["all"] }
aster_forge_db_migration.workspace = true
