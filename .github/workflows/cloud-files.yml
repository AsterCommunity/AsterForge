name: Cloud Files CI

on:
  workflow_call:
    inputs:
      packages:
        type: string
        default: '["aster_forge_cloud_files_core","aster_forge_cloud_files_linux","aster_forge_cloud_files_macos_bridge","aster_forge_cloud_files_windows"]'
  workflow_dispatch:

concurrency:
  group: cloud-files-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  core:
    name: Cloud Files Core
    if: github.event_name == 'workflow_dispatch' || contains(fromJson(inputs.packages), 'aster_forge_cloud_files_core')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-files-core-v1

      - name: Test Cloud Files Core
        run: cargo test --locked -p aster_forge_cloud_files_core --all-targets

      - name: Clippy Cloud Files Core
        run: cargo clippy --locked -p aster_forge_cloud_files_core --all-targets -- -D warnings

  windows:
    name: Windows Cloud Files
    if: github.event_name == 'workflow_dispatch' || contains(fromJson(inputs.packages), 'aster_forge_cloud_files_windows')
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-files-windows-v1

      - name: Test Windows Cloud Files
        run: cargo test --locked -p aster_forge_cloud_files_windows --all-targets

      - name: Clippy Windows Cloud Files
        run: cargo clippy --locked -p aster_forge_cloud_files_windows --all-targets -- -D warnings

  linux:
    name: Linux Cloud Files
    if: github.event_name == 'workflow_dispatch' || contains(fromJson(inputs.packages), 'aster_forge_cloud_files_linux')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-files-linux-v1

      - name: Test Linux Cloud Files
        run: cargo test --locked -p aster_forge_cloud_files_linux --all-targets

      - name: Clippy Linux Cloud Files
        run: cargo clippy --locked -p aster_forge_cloud_files_linux --all-targets -- -D warnings

  macos:
    name: macOS Cloud Files
    if: github.event_name == 'workflow_dispatch' || contains(fromJson(inputs.packages), 'aster_forge_cloud_files_macos_bridge')
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-files-macos-v1

      - name: Test macOS Cloud Files Bridge
        run: cargo test --locked -p aster_forge_cloud_files_macos_bridge --all-targets

      - name: Clippy macOS Cloud Files Bridge
        run: cargo clippy --locked -p aster_forge_cloud_files_macos_bridge --all-targets -- -D warnings

      - name: Test macOS File Provider Swift Shell
        run: |
          swift test \
            --disable-sandbox \
            --package-path crates/aster_forge_cloud_files/macos_bridge/swift \
            --scratch-path "$RUNNER_TEMP/aster-forge-macos-shell"

      - name: Generate macOS File Provider Fixture
        run: |
          cmake \
            -S crates/aster_forge_cloud_files/macos_bridge/swift-fixture \
            -B "$RUNNER_TEMP/aster-forge-macos-fixture" \
            -G Xcode \
            -DASTER_FORGE_CODE_SIGNING_ALLOWED=NO

      - name: Build macOS Memory Example and File Provider Fixture
        run: |
          cmake \
            --build "$RUNNER_TEMP/aster-forge-macos-fixture" \
            --config Debug \
            --target \
              AsterForgeCloudFilesFixtureHost \
              AsterForgeCloudFilesMacosMemoryCloudDrive

      - name: Test macOS Memory Example
        run: |
          ctest \
            --test-dir "$RUNNER_TEMP/aster-forge-macos-fixture" \
            -C Debug \
            --output-on-failure

  miri:
    name: Miri (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(inputs.packages || '["aster_forge_cloud_files_core","aster_forge_cloud_files_linux","aster_forge_cloud_files_macos_bridge","aster_forge_cloud_files_windows"]') }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Keep the Miri baseline independent from the workspace MSRV toolchain. This pinned nightly
      # is the strict-provenance baseline for the portable cloud-files contracts.
      - name: Setup pinned Miri toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-12
          components: miri, rust-src

      - name: Cache Miri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: cloud-files-miri-${{ matrix.package }}-v1

      - name: Run Miri
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          test_args=()
          export MIRIFLAGS=-Zmiri-strict-provenance
          if [[ "$PACKAGE" == aster_forge_cloud_files_core ]]; then
            export MIRIFLAGS=''
          elif [[ "$PACKAGE" == aster_forge_cloud_files_linux ]]; then
            # Durable filesystem contracts need isolation disabled. The exhaustive memory
            # example exceeds the bounded Miri budget and stays in the native Linux job.
            export MIRIFLAGS='-Zmiri-strict-provenance -Zmiri-disable-isolation'
            test_args=(--lib --test backend_contract --test create_contract --test engine_contract --test value_contract --test writeback_contract)
          fi
          cargo +nightly-2026-04-12 miri test --locked -p "$PACKAGE" "${test_args[@]}"
