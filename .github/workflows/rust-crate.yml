name: Rust Crate Checks

on:
  workflow_call:
    inputs:
      package:
        type: string
        required: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: MSRV, tests and features
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PACKAGE: ${{ inputs.package }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: crate-${{ inputs.package }}
      - name: Check MSRV
        run: cargo +1.95.0 check --locked -p "$PACKAGE" --all-targets
      - name: Test default features and documentation
        run: cargo +stable test --locked -p "$PACKAGE" --all-targets
      - name: Clippy default features
        run: cargo +stable clippy --locked -p "$PACKAGE" --all-targets -- -D warnings
