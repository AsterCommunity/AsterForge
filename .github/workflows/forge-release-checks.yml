name: Forge Release Checks
on:
  push:
    branches: [master]
    paths: &paths
      - 'release-plan.json'
      - 'tools/forge-release/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**/Cargo.toml'
      - '.github/scripts/forge-release*'
      - '.github/workflows/forge-release*'
      - '.github/actions/sync-forge-dependencies/**'
  pull_request:
    branches: [master]
    paths: *paths
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: forge-release-checks-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/forge-release
      - run: cargo fmt --manifest-path tools/forge-release/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path tools/forge-release/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path tools/forge-release/Cargo.toml --all-targets
  reviewed-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/forge-release
      - name: Identify changes to the reviewed release plan
        id: plan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if test -n "$BASE" && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            if ! git diff --quiet "$BASE" HEAD -- release-plan.json; then
              echo 'changed=true' >> "$GITHUB_OUTPUT"
            fi
          elif test -f release-plan.json; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Validate and stage the exact batch without credentials
        if: steps.plan.outputs.changed == 'true'
        run: |
          cargo run --locked --manifest-path tools/forge-release/Cargo.toml -- validate
          cargo run --locked --manifest-path tools/forge-release/Cargo.toml -- publish --dry-run
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: node --test .github/scripts/forge-release.test.cjs
