name: Rust CI

on:
  push:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aster_forge_xml/fuzz/Cargo.toml'
      - 'templates/**'
      - 'scripts/coverage-summary.mjs'
      - 'scripts/check-lint-attributes.pl'
      - 'scripts/test-auth-features.sh'
      - '.github/workflows/rust.yml'
    branches: [master]
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'crates/**/Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aster_forge_xml/fuzz/Cargo.toml'
      - 'templates/**'
      - 'scripts/coverage-summary.mjs'
      - 'scripts/check-lint-attributes.pl'
      - 'scripts/test-auth-features.sh'
      - '.github/workflows/rust.yml'
    branches: [master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  msrv:
    name: MSRV (1.95.0)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0

      - name: Cache MSRV build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.95.0-v1

      - name: Check workspace on MSRV
        run: cargo check --locked --workspace --all-targets

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Install nightly Rust toolchain for fuzzing
        run: rustup toolchain install nightly --profile minimal

      - name: Build XML fuzz harness
        run: cargo +nightly build --manifest-path crates/aster_forge_xml/fuzz/Cargo.toml --bins

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --exclude aster_forge_auth --all-targets --all-features -- -D warnings

      - name: Lint attribute policy
        run: perl scripts/check-lint-attributes.pl

      - name: Prepare coverage output directory
        run: mkdir -p coverage/rust

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests with coverage
        # Exporter/profile tests are feature-gated; default features only cover Noop.
        # Enable metrics capabilities explicitly without combining exclusive auth backends.
        run: cargo llvm-cov --workspace --features aster_forge_metrics/backend-prometheus,aster_forge_metrics/otlp,aster_forge_metrics/runtime-health,aster_forge_metrics/allocator-metrics,aster_forge_middleware/axum,aster_forge_middleware/metrics --no-fail-fast --verbose --lcov --output-path coverage/rust/lcov.info

      - name: Generate HTML coverage report
        if: success()
        run: cargo llvm-cov report --html --output-dir coverage/rust/html

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        run: bun scripts/coverage-summary.mjs "Rust" coverage/rust/lcov.info

      - name: Upload coverage reports to Codecov
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: rust-backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          if-no-files-found: ignore
          path: coverage/rust

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test workspace feature matrix
        run: |
          # Auth requires exactly one backend; its valid and invalid combinations run below.
          cargo hack test --workspace --exclude aster_forge_auth --all-targets --no-default-features --no-fail-fast
          cargo hack test --workspace --exclude aster_forge_auth --all-targets --each-feature --no-fail-fast
          cargo test --workspace --exclude aster_forge_auth --all-targets --all-features --no-fail-fast

  auth-backends:
    name: Auth (${{ matrix.os }}, ${{ matrix.backend }}, Rust 1.95.0)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        backend: [aws-lc-rs, rust-crypto]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: auth-${{ matrix.backend }}-1.95.0
      - name: Test backend without optional password support
        run: cargo test --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }} --all-targets
      - name: Test backend with password support
        run: cargo test --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }},password --all-targets
      - name: Test documentation examples
        run: cargo test --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }},password --doc
      - name: Run session example
        run: cargo run --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }} --example session_flow
      - name: Clippy
        run: cargo clippy --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }},password --all-targets -- -D warnings
      - name: Build API documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked -p aster_forge_auth --no-default-features --features ${{ matrix.backend }},password --no-deps

  auth-feature-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - name: Check isolated consumers and invalid backend combinations
        run: bash scripts/test-auth-features.sh
