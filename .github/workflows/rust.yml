name: Rust CI

on:
  push:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aster_forge_xml/fuzz/Cargo.toml'
      - 'templates/aster-service/**'
      - 'scripts/coverage-summary.mjs'
      - '.github/workflows/rust.yml'
    branches: [master]
  pull_request:
    paths:
      - '**/*.rs'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/aster_forge_xml/fuzz/Cargo.toml'
      - 'templates/aster-service/**'
      - 'scripts/coverage-summary.mjs'
      - '.github/workflows/rust.yml'
    branches: [master, develop]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Install nightly Rust toolchain for fuzzing
        run: rustup toolchain install nightly --profile minimal

      - name: Build XML fuzz harness
        run: cargo +nightly build --manifest-path crates/aster_forge_xml/fuzz/Cargo.toml --bins

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Prepare coverage output directory
        run: mkdir -p coverage/rust

      - name: Setup bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests with coverage
        run: cargo llvm-cov --workspace --no-fail-fast --verbose --lcov --output-path coverage/rust/lcov.info

      - name: Generate HTML coverage report
        if: success()
        run: cargo llvm-cov report --html --output-dir coverage/rust/html

      - name: Publish coverage summary
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        run: bun scripts/coverage-summary.mjs "Rust" coverage/rust/lcov.info

      - name: Upload coverage reports to Codecov
        if: always() && hashFiles('coverage/rust/lcov.info') != ''
        uses: codecov/codecov-action@v7
        with:
          files: coverage/rust/lcov.info
          flags: rust
          name: rust-backend
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-coverage
          if-no-files-found: ignore
          path: coverage/rust

  feature-matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Test workspace feature matrix
        run: |
          cargo hack test --workspace --all-targets --no-default-features --no-fail-fast
          cargo hack test --workspace --all-targets --each-feature --no-fail-fast
          cargo test --workspace --all-targets --all-features --no-fail-fast

  windows-cloud-files:
    name: Windows Cloud Files
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-cloud-files-v1

      - name: Test Windows Cloud Files
        run: cargo test --locked -p aster_forge_cloud_files_windows --all-targets

      - name: Clippy Windows Cloud Files
        run: cargo clippy --locked -p aster_forge_cloud_files_windows --all-targets -- -D warnings

  linux-cloud-files:
    name: Linux Cloud Files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-cloud-files-v1

      - name: Test Linux Cloud Files
        run: cargo test --locked -p aster_forge_cloud_files_linux --all-targets

      - name: Clippy Linux Cloud Files
        run: cargo clippy --locked -p aster_forge_cloud_files_linux --all-targets -- -D warnings

  miri:
    name: Miri (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: aster_forge_cloud_files_core
            miri_flags: ''
          - package: aster_forge_cloud_files_linux
            miri_flags: -Zmiri-strict-provenance
          - package: aster_forge_cloud_files_windows
            miri_flags: -Zmiri-strict-provenance
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Keep the Miri baseline independent from the workspace MSRV toolchain. This pinned nightly
      # is the strict-provenance baseline for the portable cloud-files contracts.
      - name: Setup pinned Miri toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-04-12
          components: miri, rust-src

      - name: Cache Miri build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri-${{ matrix.package }}-v1

      - name: Run Miri
        env:
          MIRIFLAGS: ${{ matrix.miri_flags }}
        run: cargo +nightly-2026-04-12 miri test --locked -p ${{ matrix.package }}
