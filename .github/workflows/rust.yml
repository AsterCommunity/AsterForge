name: Rust CI

on:
  push:
    branches: [master]
    paths:
      - 'crates/**'
      - 'templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'scripts/**'
      - 'tools/forge-release/**'
      - 'release-plan.json'
      - '.github/actions/sync-forge-dependencies/**'
      - '.github/workflows/**'
  pull_request:
    branches: [master, develop]
    paths:
      - 'crates/**'
      - 'templates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain*'
      - '.cargo/**'
      - 'scripts/**'
      - 'tools/forge-release/**'
      - 'release-plan.json'
      - '.github/actions/sync-forge-dependencies/**'
      - '.github/workflows/**'

concurrency:
  group: rust-ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Detect affected crates
    runs-on: ubuntu-latest
    outputs:
      generic_matrix: ${{ steps.classify.outputs.generic_matrix }}
      has_generic: ${{ steps.classify.outputs.has_generic }}
      has_panic: ${{ steps.classify.outputs.has_panic }}
      has_process: ${{ steps.classify.outputs.has_process }}
      has_auth: ${{ steps.classify.outputs.has_auth }}
      has_cloud_files: ${{ steps.classify.outputs.has_cloud_files }}
      cloud_packages: ${{ steps.classify.outputs.cloud_packages }}
      has_http_crypto: ${{ steps.classify.outputs.has_http_crypto }}
      has_rust: ${{ steps.classify.outputs.has_rust }}
      has_xml: ${{ steps.classify.outputs.has_xml }}
      has_template: ${{ steps.classify.outputs.has_template }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - name: Sync manually versioned local dependencies
        uses: ./.github/actions/sync-forge-dependencies
      - name: Test CI change selection
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Test workspace dependency selection
        run: python3 scripts/ci/changed-crates.py --self-test
      - name: Resolve PR merge base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "PR_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")" >> "$GITHUB_ENV"
      - name: Classify changed crates and reverse dependencies
        id: classify
        env:
          BASE_SHA: ${{ env.PR_BASE || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/ci/changed-crates.py --base "$BASE_SHA" --head "$HEAD_SHA" >> "$GITHUB_OUTPUT"

  quality:
    name: Format and workspace policies
    needs: changes
    if: needs.changes.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt --all -- --check
      - name: HTTP construction policy
        run: python3 scripts/check-http-construction.py --self-test
      - name: Lint attribute policy
        run: perl scripts/check-lint-attributes.pl
      - name: Default TLS policy
        run: python3 scripts/check-native-tls.py

  affected-crates:
    name: ${{ matrix.package }}
    needs: changes
    if: needs.changes.outputs.has_generic == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.changes.outputs.generic_matrix) }}
    uses: ./.github/workflows/rust-crate.yml
    with:
      package: ${{ matrix.package }}

  panic-contract:
    name: Panic contract
    needs: changes
    if: needs.changes.outputs.has_panic == 'true'
    uses: ./.github/workflows/rust-panic.yml

  process-contract:
    name: Process contract
    needs: changes
    if: needs.changes.outputs.has_process == 'true'
    uses: ./.github/workflows/rust-process.yml

  auth-contract:
    name: Auth contract
    needs: changes
    if: needs.changes.outputs.has_auth == 'true'
    uses: ./.github/workflows/rust-auth.yml

  http-crypto-contract:
    name: HTTP and crypto feature isolation
    needs: changes
    if: needs.changes.outputs.has_http_crypto == 'true'
    uses: ./.github/workflows/rust-http-crypto.yml

  cloud-files-contract:
    name: Cloud Files contract
    needs: changes
    if: needs.changes.outputs.has_cloud_files == 'true'
    uses: ./.github/workflows/cloud-files.yml
    with:
      packages: ${{ needs.changes.outputs.cloud_packages }}

  xml-fuzz:
    name: XML fuzz harness
    needs: changes
    if: needs.changes.outputs.has_xml == 'true'
    uses: ./.github/workflows/rust-xml.yml

  template:
    name: Service template
    needs: changes
    if: needs.changes.outputs.has_template == 'true'
    uses: ./.github/workflows/template.yml

  ci-gate:
    name: Required Rust CI
    if: always()
    needs:
      - changes
      - quality
      - affected-crates
      - panic-contract
      - process-contract
      - auth-contract
      - http-crypto-contract
      - cloud-files-contract
      - xml-fuzz
      - template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Require all applicable checks
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python3 scripts/ci/check-results.py
