name: Rust Filesystem Contract

on:
  workflow_call:

permissions:
  contents: read

jobs:
  panic-contract:
    name: Filesystem contract (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.95.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: panic-contract
      - name: Sync manually versioned local dependencies
        uses: ./.github/actions/sync-forge-dependencies
      - name: Test real hook and platform file contract
        run: cargo test --locked -p aster_forge_panic --all-targets
      - name: Test shared filesystem helpers on this platform
        run: cargo test --locked -p aster_forge_utils -p aster_forge_tasks
      - name: Test fixture lock and state publication on this platform
        run: cargo test --locked -p aster_forge_test --features containers --lib
      - name: Test private audit recovery and writer lifecycle
        run: cargo test --locked -p aster_forge_audit --features db-writer --test writer
      - name: Lint platform-specific panic paths
        run: cargo clippy --locked -p aster_forge_panic --all-targets -- -D warnings
