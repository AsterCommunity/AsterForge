[package]
name = "forge-release"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT OR Apache-2.0"
description = "Repository-local Forge release preparation and publication"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.11"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4.46"
tempfile = "3.27.0"
toml = "1.2"
toml_edit = "0.25.19"
ureq = { version = "3.5.2", default-features = false, features = ["json", "rustls"] }
